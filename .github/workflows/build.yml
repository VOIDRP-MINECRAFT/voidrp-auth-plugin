name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (Paper 26.2, Java 25)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Neutralize local dev proxy (CI only)
        run: '[ -f gradle.properties ] && sed -i "/[Pp]roxy/d" gradle.properties || true'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: voidrp-auth
          path: build/libs/*-all.jar
          retention-days: 14

      # The release text is the tag's message (scripts/release_plugin.sh writes the changes
      # there); the backend shows it on the «Интеграция» page and in update notices. A tag
      # with a hyphen (v1.5.0-beta.1) is a pre-release: the beta channel.
      - name: Release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*-all.jar
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
