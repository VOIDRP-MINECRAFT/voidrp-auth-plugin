name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (Paper 26.2, Java 25)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Neutralize local dev proxy (CI only)
        run: '[ -f gradle.properties ] && sed -i "/[Pp]roxy/d" gradle.properties || true'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: voidrp-auth
          path: build/libs/*-all.jar
          retention-days: 14

      # A tag like v1.1.0 publishes the jar as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*-all.jar
          generate_release_notes: true
